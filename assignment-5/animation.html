<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation Practice</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">

        <h1>CSS Animation Practice</h1>

       
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav" id="nav">
            <a href="#spinner">Spinner</a>
            <a href="#flip-card">Flip Card</a>
            <a href="#skeleton">Skeleton</a>
        </nav>

    </header>

    <main>

       
        <section id="spinner" class="section">
            <h2>Loading Spinner</h2>

            <div class="spinner"></div>
        </section>


        
        <section id="flip-card" class="section">

            <h2>Flip Card</h2>

            <div class="flip-card">

                <div class="flip-card-inner">

                    <div class="flip-card-front">
                        <h3>Frontend Developer</h3>
                        <p>Hover over the card</p>
                    </div>

                    <div class="flip-card-back">
                        <h3>Skills</h3>
                        <p>HTML • CSS • JavaScript</p>
                    </div>

                </div>

            </div>

        </section>


        
        <section id="skeleton" class="section">

            <h2>Skeleton Loading</h2>

            <div class="skeleton-card">

                <div class="skeleton skeleton-image"></div>

                <div class="skeleton skeleton-title"></div>

                <div class="skeleton skeleton-text"></div>

                <div class="skeleton skeleton-text short"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
